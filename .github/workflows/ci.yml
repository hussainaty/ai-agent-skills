name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r skills/session-supervisor/requirements.txt pillow
      - name: Validate skill metadata (agentskills.io format)
        run: python tools/validate_skills.py
      - name: Verify manifest hashes match the packaged skills
        run: python tools/skill_pack.py verify
      - name: Run every skill's tests
        shell: bash
        run: |
          status=0
          for tests in skills/*/tests; do
            skill=$(dirname "$tests")
            echo "::group::$skill"
            (cd "$skill" && python -W error::ResourceWarning -m unittest discover -s tests) || status=1
            echo "::endgroup::"
          done
          exit $status
